<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Cutiepie Simran ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Pacifico&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fff0f5; /* Soft lavender blush */
            --wall-color: #fffafb; 
            --primary-red: #ff3366; /* Bright, romantic red */
            --dark-red: #cc0033;
            --text-color: #333;
        }

        body {
            background-color: var(--wall-color);
            background-image: radial-gradient(var(--bg-color) 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            margin: 0;
            user-select: none;
            cursor: default;
        }

        /* Faint romantic background text */
        .obsessive-bg {
            position: fixed;
            top: -10%; left: -10%; width: 120vw; height: 120vh;
            z-index: 0;
            opacity: 0.04;
            font-size: 2.5rem;
            line-height: 1.5;
            word-wrap: break-word;
            color: var(--primary-red);
            pointer-events: none;
            font-family: 'Caveat', cursive;
            transform: rotate(-2deg);
        }

        .wall-container {
            position: relative;
            width: 100vw;
            min-height: 150vh;
            z-index: 10;
            overflow: hidden;
        }

        .polaroid {
            position: absolute;
            background: #ffffff;
            padding: 12px 12px 50px 12px;
            box-shadow: 0 15px 35px rgba(255, 51, 102, 0.15), 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #ffe6eb;
            border-radius: 4px;
            transition: transform 0.2s ease, z-index 0s, box-shadow 0.2s ease;
            cursor: grab;
            width: clamp(180px, 22vw, 320px);
            will-change: transform, left, top;
            z-index: 10; /* Added: ensures photos are above strings and notes */
        }

        .polaroid:active {
            cursor: grabbing;
            transform: scale(1.08) !important;
            z-index: 50 !important;
            box-shadow: 0 25px 50px rgba(255, 51, 102, 0.3);
        }

        .polaroid img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
            pointer-events: none;
            /* Light, flattering filter */
            filter: contrast(1.05) saturate(1.1);
        }

        .tape {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 100px;
            height: 35px;
            background: rgba(255, 51, 102, 0.4); /* Cute semi-transparent red/pink tape */
            border: 1px dashed rgba(255,255,255,0.5);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            backdrop-filter: blur(2px);
            z-index: 2;
        }
        
        .tape.alt {
            transform: translateX(-50%) rotate(4deg);
            background: rgba(255, 100, 100, 0.5);
        }

        .handwriting {
            font-family: 'Caveat', cursive;
            color: var(--dark-red);
            font-size: 1.8rem;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: none;
            font-weight: bold;
        }

        .note {
            position: absolute;
            font-family: 'Caveat', cursive;
            color: var(--primary-red);
            font-size: clamp(2.5rem, 4vw, 4rem);
            z-index: 3; /* Changed: lowered to stay behind photos */
            pointer-events: none;
            text-align: center;
            background: #fff9e6; /* Soft yellow sticky note vibe */
            padding: 10px 20px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
            border-radius: 2px 10px 10px 2px;
        }

        .center-title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Pacifico', cursive;
            font-size: clamp(4rem, 10vw, 10rem);
            color: rgba(255, 51, 102, 0.08);
            z-index: 1;
            pointer-events: none;
            white-space: nowrap;
        }

        /* SVG Container for dynamic red strings */
        #string-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Changed: lowered to stay behind photos */
            pointer-events: none;
        }

        .red-line {
            stroke: rgba(255, 51, 102, 0.6);
            stroke-width: 3;
            stroke-dasharray: 8 4;
            animation: dash 20s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: 1000; }
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            color: var(--primary-red);
            font-size: 1.5rem;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: floatUp 6s ease-in infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Soft Background Text -->
    <div class="obsessive-bg" id="obsessive-bg"></div>

    <!-- Center Dramatic Title -->
    <div class="center-title">Simran</div>

    <!-- Floating Hearts Container -->
    <div id="hearts-container" style="position: fixed; width: 100vw; height: 100vh; top:0; left:0; pointer-events: none; z-index: 0;"></div>

    <!-- The Interactive Wall -->
    <div class="wall-container" id="wall">
        
        <!-- Interactive SVG Canvas for Strings -->
        <svg id="string-canvas"></svg>

        <!-- Polaroids and Notes will be dynamically injected here by JS for perfect layout -->
    </div>

    <script>
        // Simran's Photos arranged with precise coordinates for both mobile (m) and desktop (d) to match screenshots perfectly
        const photos = [
            { url: 'https://eatliftmove.in/myphotoForWebsiteHeader.webp', caption: 'that smile 😍', mLeft: 4, mTop: 80, dLeft: 20, dTop: 100, rot: -6 },
            { url: 'https://eatliftmove.in/artephoto.jpeg', caption: 'my superstar ✨', mLeft: 45, mTop: 40, dLeft: 55, dTop: 80, rot: 7 },
            { url: 'https://eatliftmove.in/photowithbollywoodcelebrityjohnabrahim.webp', caption: 'shining brightest 🌟', mLeft: 2, mTop: 720, dLeft: 22, dTop: 750, rot: -8 },
            { url: 'https://eatliftmove.in/InNewspaperAsBiker.webp', caption: 'badass biker girl 🏍️❤️', mLeft: 38, mTop: 400, dLeft: 45, dTop: 450, rot: 3 },
            { url: 'https://eatliftmove.in/photowithHarleyDavidsonGroup.webp', caption: 'living life to the fullest', mLeft: 28, mTop: 1150, dLeft: 50, dTop: 1100, rot: 5 },
            { url: 'https://eatliftmove.in/prizeformotorcylerace.webp', caption: 'my absolute champion 🏆', mLeft: 5, mTop: 1480, dLeft: 30, dTop: 1450, rot: -4 },
            { url: 'https://eatliftmove.in/MyOwnBeforeAfter.jpg.jpeg', caption: 'so incredibly proud ❤️', mLeft: 15, mTop: 1800, dLeft: 55, dTop: 1700, rot: 3 }
        ];

        // Notes tucked perfectly into the gaps so they never cover photos
        const notesData = [
            { text: 'My gorgeous girl ❤️', mLeft: 10, mTop: 310, dLeft: 35, dTop: 350, rot: -4, bg: '#fff9e6' },
            { text: "I can't stop looking at her!", mLeft: 5, mTop: 580, dLeft: 15, dTop: 580, rot: 5, bg: '#ffe6eb' },
            { text: "MINE. 💕", mLeft: 45, mTop: 880, dLeft: 60, dTop: 850, rot: -2, bg: 'transparent', color: '#ff3366', size: 'clamp(3rem, 7vw, 5rem)', shadow: 'none' },
            { text: "My Champion 🏆", mLeft: 8, mTop: 1020, dLeft: 25, dTop: 1000, rot: -3, bg: '#fff' },
            { text: "Forever my Cutiepie ✨", mLeft: 5, mTop: 1350, dLeft: 20, dTop: 1300, rot: 4, bg: '#fff9e6' }
        ];

        let polaroidElements = [];
        let stringConnections = [];
        const wall = document.getElementById('wall');
        const svgCanvas = document.getElementById('string-canvas');

        function createObsessiveBackground() {
            const bgContainer = document.getElementById('obsessive-bg');
            const phrases = ["Simran ", "I love you ", "My cutiepie ", "Beautiful ", "Mine forever ", "Perfect "];
            let text = "";
            for(let i=0; i<800; i++) {
                text += phrases[Math.floor(Math.random() * phrases.length)];
            }
            bgContainer.innerText = text;
        }

        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartChars = ['❤️', '💕', '💖', '✨'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerText = heartChars[Math.floor(Math.random() * heartChars.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.bottom = '-20px';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's'; // 4s to 7s
                container.appendChild(heart);

                // Remove after animation finishes
                setTimeout(() => {
                    heart.remove();
                }, 7000);
            }, 800); // Spawn a new heart every 800ms
        }

        function generateWall() {
            const wallWidth = window.innerWidth;
            const isMobile = wallWidth < 768;
            // Set dynamic height based on device to fit all absolute positioned elements perfectly
            const wallHeight = isMobile ? 2200 : 2100; 
            
            // Adjust canvas size
            svgCanvas.setAttribute('width', wallWidth);
            svgCanvas.setAttribute('height', wallHeight);
            wall.style.minHeight = wallHeight + 'px';

            // Clear existing elements for clean layout calculation on resize
            wall.querySelectorAll('.polaroid, .note-element').forEach(e => e.remove());
            polaroidElements = [];
            stringConnections = [];
            svgCanvas.innerHTML = ''; 

            // 1. Render Notes First
            notesData.forEach((note) => {
                const el = document.createElement('div');
                el.className = 'note note-element';
                
                // Calculate absolute px position based on vw percentages
                const leftVw = isMobile ? note.mLeft : note.dLeft;
                const topPx = isMobile ? note.mTop : note.dTop;
                const leftPx = (wallWidth * leftVw) / 100;

                el.style.left = `${leftPx}px`;
                el.style.top = `${topPx}px`;
                el.style.transform = `rotate(${note.rot}deg)`;
                
                // Apply custom styles if they exist
                if (note.bg) el.style.background = note.bg;
                if (note.color) el.style.color = note.color;
                if (note.size) el.style.fontSize = note.size;
                if (note.shadow === 'none') el.style.boxShadow = 'none';

                el.innerHTML = note.text;
                wall.appendChild(el);
            });

            // 2. Render Photos
            photos.forEach((photo, index) => {
                const el = document.createElement('div');
                el.className = 'polaroid';
                el.id = `photo-${index}`;
                
                const leftVw = isMobile ? photo.mLeft : photo.dLeft;
                const topPx = isMobile ? photo.mTop : photo.dTop;
                const leftPx = (wallWidth * leftVw) / 100;
                
                const isAltTape = Math.random() > 0.5 ? 'alt' : '';

                el.style.left = `${leftPx}px`;
                el.style.top = `${topPx}px`;
                el.style.transform = `rotate(${photo.rot}deg)`;
                el.setAttribute('data-rotation', photo.rot);

                el.innerHTML = `
                    <div class="tape ${isAltTape}"></div>
                    <img src="${photo.url}" alt="Simran" draggable="false">
                    <div class="handwriting">${photo.caption}</div>
                `;
                
                wall.appendChild(el);
                
                polaroidElements.push({
                    id: el.id,
                    element: el,
                    // Get approximate center of the polaroid for the strings
                    getCX: () => parseFloat(el.style.left) + (el.offsetWidth / 2),
                    getCY: () => parseFloat(el.style.top) + (el.offsetHeight / 2)
                });

                // Add drag functionality
                makeDraggable(el);
            });

            // Wait for images to load so offsetWidth is accurate for center calculation
            setTimeout(() => {
                for(let i = 0; i < polaroidElements.length; i++) {
                    // Connect each photo to 1 or 2 others randomly
                    const connections = Math.floor(Math.random() * 2) + 1;
                    for(let j=0; j<connections; j++) {
                        const targetIdx = Math.floor(Math.random() * polaroidElements.length);
                        if(targetIdx !== i) {
                            createStringConnection(polaroidElements[i], polaroidElements[targetIdx]);
                        }
                    }
                }
            }, 500);
        }

        function createStringConnection(p1, p2) {
            // Prevent duplicate strings between the same two photos
            const exists = stringConnections.some(c => 
                (c.p1 === p1 && c.p2 === p2) || (c.p1 === p2 && c.p2 === p1)
            );
            if (exists) return;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('class', 'red-line');
            
            // Set initial positions
            line.setAttribute('x1', p1.getCX());
            line.setAttribute('y1', p1.getCY());
            line.setAttribute('x2', p2.getCX());
            line.setAttribute('y2', p2.getCY());

            svgCanvas.appendChild(line);

            stringConnections.push({ p1, p2, line });
        }

        function updateAllStrings() {
            stringConnections.forEach(conn => {
                conn.line.setAttribute('x1', conn.p1.getCX());
                conn.line.setAttribute('y1', conn.p1.getCY());
                conn.line.setAttribute('x2', conn.p2.getCX());
                conn.line.setAttribute('y2', conn.p2.getCY());
            });
        }

        let highestZ = 20;
        function makeDraggable(element) {
            let isDragging = false;
            let currentX, currentY, initialX, initialY;
            let xOffset = 0, yOffset = 0;
            let origLeft, origTop;

            element.addEventListener("mousedown", dragStart);
            element.addEventListener("touchstart", dragStart, {passive: false});

            function dragStart(e) {
                highestZ++;
                element.style.zIndex = highestZ;
                
                // Get current computed left/top
                origLeft = parseFloat(element.style.left) || 0;
                origTop = parseFloat(element.style.top) || 0;
                xOffset = 0;
                yOffset = 0;

                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX;
                    initialY = e.touches[0].clientY;
                } else {
                    initialX = e.clientX;
                    initialY = e.clientY;
                }

                if (e.target === element || e.target.parentNode === element) {
                    isDragging = true;
                    element.style.transition = "none"; // remove transition for smooth dragging
                    element.style.transform = `rotate(0deg) scale(1.05)`; // straighten while dragging
                }
            }

            document.addEventListener("mouseup", dragEnd);
            document.addEventListener("touchend", dragEnd);

            function dragEnd(e) {
                if (!isDragging) return;
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                
                // Apply the offset permanently to left/top to keep the SVG logic simple
                element.style.left = `${origLeft + xOffset}px`;
                element.style.top = `${origTop + yOffset}px`;
                
                // Re-apply original rotation and restore transition
                const origRot = element.getAttribute('data-rotation');
                element.style.transition = "transform 0.2s ease, box-shadow 0.2s ease";
                element.style.transform = `rotate(${origRot}deg)`;
                
                // Reset transform offset since we applied it to left/top
                xOffset = 0;
                yOffset = 0;
                updateAllStrings();
            }

            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag, {passive: false});

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();

                    if (e.type === "touchmove") {
                        currentX = e.touches[0].clientX - initialX;
                        currentY = e.touches[0].clientY - initialY;
                    } else {
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                    }

                    xOffset = currentX;
                    yOffset = currentY;
                    
                    // Move the element using left/top for absolute positioning during drag
                    element.style.left = `${origLeft + xOffset}px`;
                    element.style.top = `${origTop + yOffset}px`;
                    
                    // Keep straight while dragging
                    element.style.transform = `rotate(0deg) scale(1.05)`;
                    
                    // Update the red strings dynamically while dragging!
                    updateAllStrings();
                }
            }
        }

        // Initialize everything on load
        window.onload = () => {
            createObsessiveBackground();
            createFloatingHearts();
            generateWall();
            
            // Handle window resize to adjust layout perfectly
            window.addEventListener('resize', () => {
                generateWall();
            });
        };

    </script>
</body>
</html>
